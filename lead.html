  Tu stał konfigurator ENERGOPOOL: jeden poziom wyposażenia i osiem sztywnych rozmiarów,

  DLACZEGO PRZEKIEROWANIE, A NIE USUNIĘCIE PLIKU. GitHub Pages nie umie odpowiedzieć 301,

  Skasowany plik dałby 404 i stratę tych wejść; przekierowanie przenosi je na aktualne ceny
  RAZEM z parametrami kampanii, więc atrybucja w CRM się nie urywa.

  Katalog /assets i /pakiety zostają — korzysta z nich strona, na którą tu przekierowujemy.

<link rel="canonical" href="https://moderna-baseny.pl/konfigurator-basenu/">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=https://moderna-baseny.pl/konfigurator-basenu/">
<script>
  // Parametry kampanii (utm_*, fbclid) muszą przejść dalej, inaczej wejście z reklamy
  // zapisze się w CRM jako ruch bezpośredni. Kotwica #konfigurator istnieje też na nowej stronie.
  (function () {
    var cel = "https://moderna-baseny.pl/konfigurator-basenu/";
    var zapytanie = window.location.search || "";
    var kotwica = window.location.hash === "#konfigurator" ? "#konfigurator" : "";
    window.location.replace(cel + zapytanie + kotwica);
  })();
</script>
